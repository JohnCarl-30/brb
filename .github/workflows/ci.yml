name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24] # floating majors: the dev tooling needs Node 20.19 or newer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/brb.mjs is up to date
        run: npm run build && git diff --exit-code dist/
      - run: node dist/brb.mjs --version
      - name: Bench
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run bench
